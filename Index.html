<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine Mundial</title>

<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
  background:
  linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,1)),
  url('https://images.unsplash.com/photo-1505685296765-3a2736de412f?q=80&w=1600') center/cover no-repeat fixed;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
}

.logo{
  color:red;
  font-size:28px;
  font-weight:bold;
}

/* HERO */
.hero{
  height:35vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.hero h1{
  font-size:45px;
}

/* GRID */
.container{padding:20px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

/* CARD */
.card{
  position:relative;
  height:270px;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card:hover{
  transform:scale(1.1);
}

.overlay{
  position:absolute;
  bottom:0;
  width:100%;
  padding:10px;
  background:linear-gradient(transparent, black);
}

/* ICONO */
.card::after{
  content:"▶";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
  transition:.3s;
  font-size:30px;
}

.card:hover::after{
  opacity:1;
}

/* BANNER */
.banner{
  display:flex;
  justify-content:center;
  margin:15px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 Cine Mundial</div>
</header>

<section class="hero">
  <h1>Películas Gratis</h1>
</section>

<!-- ANUNCIO -->
<div class="banner">
  <script>
    atOptions = {
      'key' : '4f089beb98f49be61fa0c0fb471066b5',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script src="https://www.highperformanceformat.com/4f089beb98f49be61fa0c0fb471066b5/invoke.js"></script>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>

let peliculas = [
  {titulo:"Acción Extrema",img:"1.jpg",link:"https://vix.com"},
  {titulo:"Son como niños",img:"2.jpg",link:"https://vix.com"},
  {titulo:"El Orfanato",img:"3.jpg",link:"https://vix.com"},
  {titulo:"El Rescate",img:"4.jpg",link:"https://vix.com"},
  {titulo:"Isla Maldita",img:"5.jpg",link:"https://vix.com"},
  {titulo:"Terremoto 10.10",img:"6.jpg",link:"https://vix.com"},
  {titulo:"Tornado de terror",img:"7.jpg",link:"https://vix.com"},
  {titulo:"¿Quieres ser mi hijo?",img:"8.jpg",link:"https://vix.com"},
  {titulo:"Scary Movie",img:"9.jpg",link:"https://vix.com"},
  {titulo:"Tonta pero no tanto",img:"10.jpg",link:"https://tubitv.com/movies/100054553/tonta-tonta-pero-no-tanto"},
  {titulo:"Miedo profundo",img:"11.jpg",link:"https://tubitv.com/movies/588234/miedo-profundo-doblado"},
  {titulo:"Muñeca de payaso",img:"12.jpg",link:"https://tubitv.com/movies/686275/mu-eca-de-payaso-doblado"},
  {titulo:"Hansel y Gretel",img:"13.jpg",link:"https://tubitv.com/movies/536449/hansel-and-gretel-doblado"},
  {titulo:"Lechuza",img:"14.jpg",link:"https://tubitv.com/movies/100043856/lechuza"},
  {titulo:"Batalla de Bestias",img:"15.jpg",link:"https://tubitv.com/movies/100043258/la-batalla-de-las-bestias"},
  {titulo:"Megalodon",img:"16.jpg",link:"https://tubitv.com/movies/100041547/megalodon"},
  {titulo:"Robocop",img:"17.jpg",link:"https://tubitv.com/series/300009288/robocop-the-series-espa-ol"},
  {titulo:"La leyenda del rey mono",img:"18.jpg",link:"https://tubitv.com/movies/666870/la-leyenda-del-rey-mono-el-regreso-del-h-roe-doblado"},
  {titulo:"La serie de la pandilla de Sugar Creek",img:"19.jpg",link:"https://tubitv.com/tv-shows/200014205/s01-e01-race-against-nightfall"},
  {titulo:"El transportador 3",img:"20.jpg",link:"https://tubitv.com/movies/100044388/el-transportador-3"}
];

function abrir(link){
  window.open(link, "_blank");
}

function shuffle(array){
  return array.sort(()=>Math.random()-0.5);
}

let grid = document.getElementById("grid");

function render(){
  let lista = shuffle(peliculas);
  grid.innerHTML="";

  lista.forEach(p=>{
    grid.innerHTML += `
    <div class="card" onclick="abrir('${p.link}')">
      <img src="${p.img}">
      <div class="overlay">
        <h3>${p.titulo}</h3>
      </div>
    </div>`;
  });
}

render();

</script>

</body>
</html>
